<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>AzMİU – Tələbə Portalı (Qırılmaz Test)</title>
    <style>
        :root {
            --bg1:#0d1117; --bg2:#161b27;
            --glass:rgba(255,255,255,0.045); --glass-border:rgba(255,255,255,0.08); --glass-hover:rgba(255,255,255,0.07);
            --amber:#f5a623; --amber-dim:rgba(245,166,35,0.15);
            --blue:#3b82f6; --blue-dim:rgba(59,130,246,0.15);
            --green:#22c55e; --green-dim:rgba(34,197,94,0.12);
            --red:#ef4444; --red-dim:rgba(239,68,68,0.12);
            --text:#f1f5f9; --text-2:#94a3b8; --text-3:#475569;
            --surface:rgba(255,255,255,0.04);
            --radius-xl:28px; --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
            --shadow-card:0 32px 64px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.04) inset;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:-apple-system,sans-serif; background:var(--bg1); min-height:100vh; display:flex; justify-content:center; padding:60px 12px; position:relative;}
        .portal-wrap{width:100%; max-width:560px; position:relative; z-index:1;}
        .main-card{background:var(--bg2); border:1px solid var(--glass-border); border-radius:36px; padding:24px 20px; box-shadow:var(--shadow-card);}
        .app-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
        .header-title{font-size:1.5rem; font-weight:800; color:var(--text);}
        .header-title span{color:var(--blue);}
        .field-group{margin-bottom:14px;}
        .field-label{font-size:0.75rem; font-weight:700; color:var(--text-2); margin-bottom:6px; text-transform:uppercase;}
        .field-input{width:100%; background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-md); padding:13px 16px; font-size:0.95rem; color:white; outline:none;}
        .submit-btn{width:100%; padding:15px; border:none; border-radius:var(--radius-lg); font-size:1rem; font-weight:700; color:white; background:linear-gradient(135deg,#1d4ed8,#3b82f6); cursor:pointer; box-shadow:0 8px 20px rgba(59,130,246,0.3);}
        .error-box{background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); border-radius:var(--radius-md); padding:12px; margin-bottom:16px; color:#fca5a5; font-size:0.88rem; display:none;}
        
        .loading-overlay{display:none; position:fixed; inset:0; background:rgba(13,17,23,0.96); z-index:9999; flex-direction:column; justify-content:center; align-items:center; gap:20px;}
        .loading-overlay.active{display:flex;}
        .spinner{width:50px; height:50px; border:3px solid var(--glass-border); border-top-color:var(--blue); border-radius:50%; animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .loading-text{text-align:center; color:white;}

        #resultsArea{display:none; margin-top:10px;}
        .fenn-card{background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-xl); margin-bottom:14px; padding:16px; animation: fadeIn 0.3s ease;}
        .fenn-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
        .fenn-name{font-size:1.05rem; font-weight:700; color:white; flex:1; padding-right:10px;}
        .qayib-badge{font-size:1.1rem; font-weight:800; color:var(--green); background:rgba(34,197,94,0.1); padding:4px 10px; border-radius:10px; flex-shrink:0;}
        .months-table{width:100%; border-collapse:collapse; margin-top:12px; margin-bottom:12px; border:1px solid var(--glass-border); border-radius:8px; overflow:hidden;}
        .months-table th, .months-table td{padding:8px 12px; text-align:left; font-size:0.85rem; border:1px solid var(--glass-border);}
        .months-table th{background:var(--surface); color:var(--text-2); text-transform:uppercase;}
        .months-table td{color:white;}
        .iqb-row{margin-top:10px; background:var(--blue-dim); padding:10px; border-radius:8px; display:flex; justify-content:space-between; font-weight:700;}
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">
        <h4 id="statusTitle">Universitet Sisteminə Qoşulur...</h4>
        <p id="statusDesc">Məlumatlar Bakıdakı ESP32 düyünündən çəkilir (≈10-15 san)</p>
    </div>
</div>

<div class="portal-wrap">
    <div class="main-card">
        <div class="app-header">
            <div class="header-title">Tələbə<span> Portalı</span></div>
            <span style="font-size:0.75rem; background:var(--glass); padding:4px 10px; border-radius:20px; color:var(--text-2);">Sandbox Mode (Qırılmaz)</span>
        </div>

        <div id="loginSection">
            <div class="error-box" id="errorBox">⚠️ Xəta baş verdi</div>
            <div class="field-group">
                <div class="field-label">İstifadəçi adı (ATIS)</div>
                <input type="text" id="username" class="field-input" placeholder="Nümunə: 121446514">
            </div>
            <div class="field-group">
                <div class="field-label">Şifrə</div>
                <input type="password" id="password" class="field-input" placeholder="••••••••">
            </div>
            <button class="submit-btn" id="startBtn">Daxil Ol</button>
        </div>

        <div id="resultsArea">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:white;">📊 Akademik Göstəricilər</h3>
                <button onclick="window.location.reload()" style="background:var(--glass); border:none; color:white; padding:6px 12px; border-radius:20px; cursor:pointer;">↩ Çıxış et</button>
            </div>
            <div id="cardsContainer"></div>
        </div>
    </div>
</div>

<script>
// PHP-siz birbaşa JavaScript daxilində limit datası
const QAYIB_META = {
    'İnformasiya texnologiyaları': {limit: 13, hours: 90, rule: '6–8 qayıb → 1 bal, 9–12 qayıb → 2 bal aparır'},
    'Xarici dildə': {limit: 11, hours: 75, rule: '5–7 qayıb → 1 bal, 8–10 qayıb → 2 bal aparır'},
    'Proqramlaşdırma': {limit: 11, hours: 75, rule: '5–7 qayıb → 1 bal, 8–10 qayıb → 2 bal aparır'},
    'Diskret riyaziyyat': {limit: 5, hours: 30, rule: '3 qayıb → 1 bal, 4 qayıb → 2 bal aparır'},
    'Diferensial tənliklər': {limit: 5, hours: 30, rule: '3 qayıb → 1 bal, 4 qayıb → 2 bal aparır'},
    'Sahibkarlıq': {limit: 5, hours: 30, rule: '3 qayıb → 1 bal, 4 qayıb → 2 bal aparır'}
};

function getMeta(name) {
    for (let key in QAYIB_META) {
        if (name.toLowerCase().includes(key.toLowerCase())) return QAYIB_META[key];
    }
    return null;
}

document.getElementById('startBtn').onclick = async function() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const errBox = document.getElementById('errorBox');
    
    if(!user || !pass) {
        errBox.textContent = "⚠️ Zəhmət olmasa bütün xanaları doldurun.";
        errBox.style.display = "block";
        return;
    }
    
    errBox.style.display = "none";
    document.getElementById('loadingOverlay').classList.add('active');
    
    try {
        const response = await fetch('https://get-grades.onrender.com/get-grades', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ username: user, password: pass })
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
            document.getElementById('loadingOverlay').classList.remove('active');
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'block';
            
            const container = document.getElementById('cardsContainer');
            container.innerHTML = "";
            
            result.data.forEach(fenn => {
                const meta = getMeta(fenn.display_name);
                let limitHtml = "";
                if(meta) {
                    limitHtml = `
                        <div style="font-size:0.78rem; color:#94a3b8; margin-top:6px; background:rgba(255,255,255,0.03); padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.05)">
                            <b>Limit:</b> ${meta.limit} saat | ${meta.rule}
                        </div>
                    `;
                }
                
                let tableRows = "";
                let totalIqb = 0;
                
                for(let bType in fenn.ballar) {
                    let m = fenn.ballar[bType].Mart || "-";
                    let a = fenn.ballar[bType].Aprel || "-";
                    let my = fenn.ballar[bType].May || "-";
                    
                    [m, a, my].forEach(val => {
                        if(val && val !== '-' && bType !== "Davamiyyət (Qayıb)") {
                            let part = val.includes('/') ? val.split('/').pop().trim() : val.trim();
                            if(!isNaN(part) && part !== "") totalIqb += parseFloat(part);
                        }
                    });
                    
                    tableRows += `
                        <tr>
                            <td><b>${bType}</b></td>
                            <td>${m}</td>
                            <td>${a}</td>
                            <td>${my}</td>
                        </tr>
                    `;
                }
                
                let badgeColor = fenn.qayib >= (meta ? meta.limit : 99) ? '#ef4444' : '#22c55e';
                let badgeBg = fenn.qayib >= (meta ? meta.limit : 99) ? 'rgba(239,68,68,0.1)' : 'rgba(34,197,94,0.1)';
                
                const card = `
                    <div class="fenn-card">
                        <div class="fenn-header">
                            <div class="fenn-name">${fenn.display_name}</div>
                            <div class="qayib-badge" style="color:${badgeColor}; background:${badgeBg};">${fenn.qayib} Saat</div>
                        </div>
                        ${limitHtml}
                        <table class="months-table">
                            <thead><tr><th>Balın Növü</th><th>Mart</th><th>Aprel</th><th>May</th></tr></thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                        <div class="iqb-row"><span>💎 İQB (Semestr Balı):</span><span style="color:#3b82f6; font-size:1.1rem;">${totalIqb.toFixed(1)}</span></div>
                    </div>
                `;
                container.innerHTML += card;
            });
            
        } else {
            document.getElementById('loadingOverlay').classList.remove('active');
            errBox.textContent = "⚠️ " + (result.message || "Giriş xətası! Şifrə/login səhvdir.");
            errBox.style.display = "block";
        }
    } catch (e) {
        document.getElementById('loadingOverlay').classList.remove('active');
        errBox.textContent = "⚠️ Şəbəkə xətası! Sandbox bloklaması.";
        errBox.style.display = "block";
        console.error(e);
    }
};
</script>
</body>
</html>
